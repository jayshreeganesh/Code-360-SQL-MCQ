name: Create Daily MD File

on:
  schedule:
    # This runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  create-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create file with current date
        run: |
          # Get date in YYYY-MM-DD format
          FILENAME=$(date +'%Y-%m-%d').md
          echo "# Notes for $(date +'%Y-%m-%d')" > "$FILENAME"
          echo "Generated automatically by GitHub Actions." >> "$FILENAME"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add daily file: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
